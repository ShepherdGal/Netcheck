<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Netcheck icon, "Dusk gauge" (P9, 2026-11-16; taskbar refit A 2026-11-16: tile edge to edge, night-blue bottom, gauge x1.2 centred). Geometry measured from the original icon (tile 17–239,
       arc centre 127.5,148, radius 75.5, stroke 10, ticks at 11/49.5/90/130.5/169°, hub 127.5,154, needle at 43°); colours from Theme/Tokens.axaml. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4472"/><stop offset=".6" stop-color="#1A2C4C"/><stop offset="1" stop-color="#15243C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".8">
      <stop offset="0" stop-color="#2E4A7A" stop-opacity=".85"/><stop offset="1" stop-color="#18294A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="53" y1="160" x2="192" y2="109">
      <stop offset="0" stop-color="#7FA9E6"/><stop offset="1" stop-color="#D6E7FC"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#tile)"/>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#glow)"/>
  <rect x="4.75" y="4.75" width="246.5" height="246.5" rx="55.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <!-- gauge in the original's 256 px coordinates, scaled 1.32× and exactly centred: its box (x 47–207, arc top 67.5 to hub bottom 164.8, centre 127,116.15) sits on the tile centre 128,128 (user, 2026-11-17: it sat ~8 px low and looked small) -->
  <g transform="translate(128 128) scale(1.32) translate(-127 -116.15)">
    <!-- soft light under the lit part of the arc -->
    <path d="M52.9 159.8 A75.5 75.5 0 0 1 192.2 109.1" fill="none" stroke="#8DB8F2" stroke-opacity=".35" stroke-width="14" stroke-linecap="round" filter="url(#soft)"/>
  <!-- unlit end of the scale -->
  <path d="M192.2 109.1 A75.5 75.5 0 0 1 202.2 159" fill="none" stroke="#3E5680" stroke-width="10" stroke-linecap="round"/>
  <!-- lit scale -->
  <path d="M52.9 159.8 A75.5 75.5 0 0 1 192.2 109.1" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round"/>
  <!-- ticks at 11°, 49.5°, 90°, 130.5°, 169° around the arc centre, radius 54–61 -->
  <g stroke="#7F94B0" stroke-width="4" stroke-linecap="round">
    <line x1="180.5" y1="137.7" x2="187.4" y2="136.4"/>
    <line x1="162.6" y1="106.9" x2="167.1" y2="101.6"/>
    <line x1="127.5" y1="94" x2="127.5" y2="87"/>
    <line x1="92.4" y1="106.9" x2="87.9" y2="101.6"/>
    <line x1="74.5" y1="137.7" x2="67.6" y2="136.4"/>
  </g>
  <!-- needle (tapered, 43°) and hub -->
  <path d="M124.4 150.7 L175.8 109 L130.6 157.3 Z" fill="#E9F0FA" stroke="#E9F0FA" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="127.5" cy="154" r="9.5" fill="#E9F0FA"/>
  </g>
</svg>
